  let color = isFin ? L.finColor : [0.1, 0.1, 0.1];
  if (!isFin) {
    for (const zone of L.zones) { if (zFrac >= zone.from && zFrac < zone.to) { color = zone.color; break; } }
    const ang = (Math.atan2(-v[1], v[0]) / Math.PI + 1) / 2;
    if (L.split && zFrac >= L.split.zFrom && zFrac <= L.split.zTo) {
      const s = L.split;
      const a = ((ang - (s.offset || 0)) % 1 + 1) % 1;
      if (a < s.fraction) color = s.colorA;
      else color = s.colorB;
    }
    if (L.stripes) {
      for (const s of L.stripes) {
        if (zFrac < s.zFrom || zFrac > s.zTo) continue;
        let pos = ang;
        if (s.offset) pos = ((pos + s.offset) % 1 + 1) % 1;
        if (s.twist) pos = ((pos + zFrac * s.twist) % 1 + 1) % 1;
        const step = 1 / s.count;
        const half = s.width / 2;
        const edge = 0.025;
        for (let si = 0; si < s.count; si++) {
          const center = si * step + step / 2;
          const dist = Math.min(Math.abs(pos - center), Math.abs(pos - center + 1), Math.abs(pos - center - 1));
          if (dist < half + edge) {
            const t = dist < half - edge ? 1.0 : (half + edge - dist) / (2 * edge);
            color = [color[0]*(1-t)+s.color[0]*t, color[1]*(1-t)+s.color[1]*t, color[2]*(1-t)+s.color[2]*t];
            break;
          }
        }
      }
    }
  }
  return color;
}

function buildFaceArrays(liveryKey, finOnly) {
  const L = liveries[liveryKey];
  const count = meshData.f.reduce((n, _, i) => n + ((meshData.fin[i] === 1) === finOnly ? 1 : 0), 0);
  const positions = new Float32Array(count * 9);
  const colors = new Float32Array(count * 9);
  const normals = new Float32Array(count * 9);
  let out = 0;

  for (let fi = 0; fi < meshData.f.length; fi++) {
    const isFin = meshData.fin[fi] === 1;
    if (isFin !== finOnly) continue;
    const face = meshData.f[fi];
    const v0 = meshData.v[face[0]], v1 = meshData.v[face[1]], v2 = meshData.v[face[2]];
    const idx = out * 9;
    positions[idx]=v0[0]; positions[idx+1]=v0[2]; positions[idx+2]=-v0[1];
    positions[idx+3]=v1[0]; positions[idx+4]=v1[2]; positions[idx+5]=-v1[1];
    positions[idx+6]=v2[0]; positions[idx+7]=v2[2]; positions[idx+8]=-v2[1];
    const ax=v1[0]-v0[0], ay=v1[2]-v0[2], az=-(v1[1]-v0[1]);
    const bx=v2[0]-v0[0], by=v2[2]-v0[2], bz=-(v2[1]-v0[1]);
    let nx=ay*bz-az*by, ny=az*bx-ax*bz, nz=ax*by-ay*bx;
    const len = Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
    nx/=len; ny/=len; nz/=len;
    for (let vi=0;vi<3;vi++){normals[idx+vi*3]=nx;normals[idx+vi*3+1]=ny;normals[idx+vi*3+2]=nz;}
    const verts = [v0, v1, v2];
    for (let vi = 0; vi < 3; vi++) {
      const c = vertexColor(verts[vi], L, isFin);
      colors[idx+vi*3] = c[0]; colors[idx+vi*3+1] = c[1]; colors[idx+vi*3+2] = c[2];
    }
    out++;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  geo.setAttribute('normal', new THREE.BufferAttribute(normals,3));
  return geo;
}

// ============================================================
// TEXT — CURVED CYLINDER STRIPS
// ============================================================
function makeTextCanvas(def, arcLen) {
  if (def.vertical) {
    const letters = def.text.split('');
    const n = letters.length;
    const ppL = 64;
    const vs = def.vSpacing || 1.0;
    const cellH = Math.round(ppL * vs);
    const canvas = document.createElement('canvas');
    canvas.width = ppL;
    canvas.height = n * cellH;
    const ctx = canvas.getContext('2d');
    const fam = def.family === 'serif' ? "'Quadrillion', sans-serif" : "'Quadrillion', sans-serif";
    const fs = Math.round(ppL * 0.62);
    ctx.font = `${def.weight} ${fs}px ${fam}`;
    ctx.fillStyle = def.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) ctx.fillText(letters[i], ppL/2, cellH*i + cellH/2);
    return canvas;
  }

  const surfaceAspect = arcLen / def.size;
  const pxH = 192;
  const pxW = Math.max(768, Math.round(pxH * surfaceAspect));
  const canvas = document.createElement('canvas');
  canvas.width = pxW;
  canvas.height = pxH;
  const ctx = canvas.getContext('2d');
  const fam = def.family === 'serif' ? "'Quadrillion', sans-serif" : "'Quadrillion', sans-serif";
  let fs = Math.round(pxH * 0.52);
  ctx.font = `${def.weight} ${fs}px ${fam}`;
  while (ctx.measureText(def.text).width > pxW * 0.9 && fs > 10) {
    fs -= 2;
    ctx.font = `${def.weight} ${fs}px ${fam}`;
  }
  ctx.fillStyle = def.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (def.spacing) ctx.letterSpacing = `${def.spacing}px`;
  ctx.fillText(def.text, pxW/2, pxH/2);
  return canvas;
}

function buildCylinderStrip(radius, yPos, height, startAngle, arcAngle, texture) {
  const segs = 64;
  const pos = [], uv = [], nrm = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i/segs;
    const a = startAngle + t*arcAngle;
    const x = Math.sin(a)*radius, z = Math.cos(a)*radius;
    pos.push(x, yPos-height/2, z); nrm.push(Math.sin(a),0,Math.cos(a)); uv.push(t, 0);
    pos.push(x, yPos+height/2, z); nrm.push(Math.sin(a),0,Math.cos(a)); uv.push(t, 1);
    if (i < segs) { const b=i*2; idx.push(b,b+1,b+2,b+1,b+3,b+2); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm,3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  geo.setIndex(idx);
  const tex = new THREE.CanvasTexture(texture);
  tex.anisotropy = 16;
  const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, side:THREE.DoubleSide, depthWrite:false });
  return new THREE.Mesh(geo, mat);
}

function buildTextLabels(liveryKey) {
  const group = new THREE.Group();
  const defs = textDefs[liveryKey];
  const R = 0.75;

  for (const def of defs) {
    const yPos = def.zFrac * Z_MAX;
    const isVert = def.vertical || false;
    const arcSpan = isVert ? Math.PI * 0.15 : Math.PI * 0.82;
    const arcLen = R * arcSpan;
    const canvas = makeTextCanvas(def, arcLen);
    const sides = 2;
    const angleOff = (def.angleOffset || 0) * Math.PI / 180;
    for (let s = 0; s < sides; s++) {
      const center = s * (Math.PI*2/sides) + angleOff;
      const strip = buildCylinderStrip(R, yPos, def.size, center - arcSpan/2, arcSpan, canvas);
      group.add(strip);
    }
  }
  return group;
}

// ============================================================
// ROCKET MESHES
// ============================================================
function buildRocketMeshes(liveryKey) {
  const bodyGeo = buildFaceArrays(liveryKey, false);
  const finGeo = buildFaceArrays(liveryKey, true);
  const bodyMat = new THREE.MeshPhysicalMaterial({
    vertexColors: true, metalness: 0.4, roughness: 0.35,
    side: THREE.DoubleSide, clearcoat: 0.3, clearcoatRoughness: 0.2,
  });
  const finMat = new THREE.MeshPhysicalMaterial({
    vertexColors: true, metalness: 0.5, roughness: 0.3,
    side: THREE.DoubleSide, clearcoat: 0.4, clearcoatRoughness: 0.15,
    polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1,
  });
  return { body: new THREE.Mesh(bodyGeo, bodyMat), fins: new THREE.Mesh(finGeo, finMat) };
}

// ============================================================
// SCENE
// ============================================================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(12, 10, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, Z_MAX/2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.minDistance = 8;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.85;
controls.update();

// Lighting
const ambient = new THREE.AmbientLight(0x404860, 1.0);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff5e0, 3.0);
sun.position.set(15, 25, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5; sun.shadow.camera.right = 5;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -2;
sun.shadow.bias = -0.001;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x8090c0, 1.2);
fill.position.set(-12, 15, -8);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd080, 0.6);
rim.position.set(-5, 8, -18);
scene.add(rim);

const underFill = new THREE.DirectionalLight(0x4060a0, 0.3);
underFill.position.set(0, -5, 10);
scene.add(underFill);

// Ground (removed)

scene.background = new THREE.Color(0xd0dce8);
scene.fog = new THREE.Fog(0xd0dce8, 30, 80);

// Rocket group
const rocketGroup = new THREE.Group();
scene.add(rocketGroup);


// ============================================================
// LIVERY SWITCHING
// ============================================================
function updateSceneForLivery(L) {
  scene.background.set(L.bgColor);
  scene.fog.color.set(L.bgColor);
  scene.fog.near = L.fogNear;
  scene.fog.far = L.fogFar;
}

function setLiveryInternal(key) {
  if (bodyMesh) { rocketGroup.remove(bodyMesh); bodyMesh.geometry.dispose(); bodyMesh.material.dispose(); }
  if (finMesh) { rocketGroup.remove(finMesh); finMesh.geometry.dispose(); finMesh.material.dispose(); }
  if (textGroup) {
    textGroup.traverse(c => { if(c.isMesh){c.geometry.dispose();c.material.map?.dispose();c.material.dispose();} });
    rocketGroup.remove(textGroup);
  }
  const meshes = buildRocketMeshes(key);
  bodyMesh = meshes.body;
  bodyMesh.castShadow = true;
  finMesh = meshes.fins;
  finMesh.castShadow = true;
  textGroup = buildTextLabels(key);
  rocketGroup.add(bodyMesh);
  rocketGroup.add(finMesh);
  rocketGroup.add(textGroup);
  updateSceneForLivery(liveries[key]);
  document.getElementById('livery-name').textContent = liveries[key].name;
}

setLiveryInternal('B');

// ============================================================
// UI
// ============================================================
let spinning = true;

window.setLivery = function(key) {
  setLiveryInternal(key);
};

window.toggleSpin = function() {
  spinning = !spinning;
  event.target.textContent = 'Auto-Rotate';
  event.target.classList.toggle('active', spinning);
};


// ============================================================
// CUSTOM PANEL WIRING
// ============================================================
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  return [r, g, b];
}
function darken(rgb, f) { return [rgb[0]*f, rgb[1]*f, rgb[2]*f]; }

function updateCustom() {
  const C = liveries.C;
  const body = hexToRgb(document.getElementById('cp-body').value);
  const nose = hexToRgb(document.getElementById('cp-nose').value);
  const fins = hexToRgb(document.getElementById('cp-fins').value);
  const bg = hexToRgb(document.getElementById('cp-bg').value);
  const textCol = document.getElementById('cp-text').value;
  const stripesOn = document.getElementById('cp-stripes-on').checked;
  const sColor = hexToRgb(document.getElementById('cp-stripes-color').value);
  const sCount = parseInt(document.getElementById('cp-stripes-count').value);
  const sWidth = parseFloat(document.getElementById('cp-stripes-width').value);
  const sTwist = parseFloat(document.getElementById('cp-stripes-twist').value);

  document.getElementById('cp-stripes-count-val').textContent = sCount;
  document.getElementById('cp-stripes-width-val').textContent = sWidth.toFixed(2);
  document.getElementById('cp-stripes-twist-val').textContent = sTwist.toFixed(1);

  C.zones = [
    { from: 0.00, to: 0.06, color: darken(body, 0.3) },
    { from: 0.06, to: 0.85, color: body },
    { from: 0.85, to: 1.00, color: nose },
  ];
  C.finColor = fins;
  C.bgColor = new THREE.Color(bg[0], bg[1], bg[2]).getHex();

  if (stripesOn) {
    C.stripes = [{ count: sCount, width: sWidth, color: sColor, zFrom: 0.06, zTo: 1.00, twist: sTwist, offset: 0.194 }];
  } else {
    C.stripes = null;
  }

  textDefs.C.forEach(d => d.color = textCol);

  setLiveryInternal('C');
}

document.querySelectorAll('#custom-panel input, #custom-panel select').forEach(el => {
  el.addEventListener('input', () => {
    const active = document.querySelector('.btn.active');
    if (active && active.textContent.includes('Custom')) updateCustom();
  });
  el.addEventListener('change', () => {
    const active = document.querySelector('.btn.active');
    if (active && active.textContent.includes('Custom')) updateCustom();
  });
});

function rgbToHex(rgb) {
  return '#' + rgb.map(v => Math.round(v*255).toString(16).padStart(2,'0')).join('');
}

function getCustomConfig() {
  const C = liveries.C;
  return {
    body: rgbToHex(C.zones[1]?.color || [0,0,0]),
    nose: rgbToHex(C.zones[2]?.color || C.zones[1]?.color || [0,0,0]),
    fins: rgbToHex(C.finColor),
    text: textDefs.C[0]?.color || '#ffffff',
    bg: '#' + new THREE.Color(C.bgColor).getHexString(),
    stripes: C.stripes ? {
      enabled: true,
      color: rgbToHex(C.stripes[0].color),
      count: C.stripes[0].count,
      width: C.stripes[0].width,
      twist: C.stripes[0].twist || 0,
    } : { enabled: false },
  };
}

function syncRawText() {
  const raw = document.getElementById('cp-raw');
  if (raw.style.display !== 'none') {
    raw.value = JSON.stringify(getCustomConfig(), null, 2);
  }
}

window.toggleRawEdit = function() {
  const raw = document.getElementById('cp-raw');
  const btn = document.getElementById('cp-raw-apply');
  const show = raw.style.display === 'none';
  raw.style.display = show ? 'block' : 'none';
  btn.style.display = show ? 'block' : 'none';
  if (show) syncRawText();
};

window.applyRawConfig = function() {
  try {
    const cfg = JSON.parse(document.getElementById('cp-raw').value);
    document.getElementById('cp-body').value = cfg.body;
    document.getElementById('cp-nose').value = cfg.nose;
    document.getElementById('cp-fins').value = cfg.fins;
    document.getElementById('cp-text').value = cfg.text;
    document.getElementById('cp-bg').value = cfg.bg;
    document.getElementById('cp-stripes-on').checked = cfg.stripes?.enabled !== false;
    if (cfg.stripes?.color) document.getElementById('cp-stripes-color').value = cfg.stripes.color;
    if (cfg.stripes?.count) { document.getElementById('cp-stripes-count').value = cfg.stripes.count; document.getElementById('cp-stripes-count-val').textContent = cfg.stripes.count; }
    if (cfg.stripes?.width) { document.getElementById('cp-stripes-width').value = cfg.stripes.width; document.getElementById('cp-stripes-width-val').textContent = cfg.stripes.width.toFixed(2); }
    if (cfg.stripes?.twist != null) { document.getElementById('cp-stripes-twist').value = cfg.stripes.twist; document.getElementById('cp-stripes-twist-val').textContent = cfg.stripes.twist.toFixed(1); }
    updateCustom();
  } catch(e) {
    alert('Invalid JSON: ' + e.message);
  }
};

const origUpdateCustom = updateCustom;
updateCustom = function() { origUpdateCustom(); syncRawText(); };

// ============================================================
// ANIMATE
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  if (spinning) rocketGroup.rotation.y += 0.003;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
